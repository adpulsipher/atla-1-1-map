[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "atla-builder"
version = "1.0.0"
description = "Populate the ATLA 9k x 7k Minecraft terrain with canon landmarks"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10", "nbtlib>=2.0", "pillow>=10.0"]

[project.optional-dependencies]
lz4 = ["lz4>=4.0"]
dev = ["pytest>=7"]

[project.scripts]
atla-builder = "atla_builder.cli:main"

[tool.setuptools.packages.find]
include = ["atla_builder*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
